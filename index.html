-yunmeng","title":"南理故地 · 清安与云梦","world":"山海界","area":"南理国／云梦大泽","width":5500,"height":4750,"note":"凡尘炼心篇发生于山海界南理国，不是另一宇宙。清安在南理西南、长沂府南；云泽更南。图合示稍后兴建的天云城，未绘朝代疆界。云泽府与后文云梦大泽指向同一主要地域，但没有据此宣称两者边界完全重合。三河、天云在云泽／大泽内的东西坐标，清水河河向，以及具体湖泊岸线无据，均以星号脚注说明；未把地理图转成行程图。","sources":[{"title":"原文章页 1457","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1457.html"},{"title":"原文章页 1460","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1460.html"},{"title":"原文章页 1470","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1470.html"},{"title":"原文章页 1477","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1477.html"},{"title":"原文章页 1492","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1492.html"},{"title":"原文章页 1494","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1494.html"},{"title":"原文章页 1496","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1496.html"},{"title":"原文章页 1504","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1504.html"}]},{"id":"haotian-yongle","title":"永乐与莽龙山","world":"昊天界","area":"永乐地域","width":4500,"height":3250,"note":"原文第627—628章：永乐建在龙龟背上，位于平原，地面卫城环绕、外围有灵田农庄；第700章莽龙山脉在城西北，两万余里，山脉自西向东延展。没有将相对方向未核实的白龙大泽接入本幅。","sources":[{"chapter":627,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/627.html"},{"chapter":628,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/628.html"},{"chapter":700,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/700.html"}]},{"id":"haotian-qianxing","title":"千星仙城与迎仙镇","world":"昊天界","area":"千星地域","width":4500,"height":3250,"note":"第719章：千星仙城建在站立龙龟背上，宽江穿过龟腹，两岸为屋舍码头，上下游有田园农庄；迎仙镇在西面驰道终点、左前足下。未把与永乐的万里行程转换成全局方位。","sources":[{"chapter":719,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/719.html"}]},{"id":"haotian-luodu","title":"洛都仙城","world":"昊天界","area":"洛都地域","width":4500,"height":3250,"note":"第1038章洛都为群山仙城，南面有大批灵田农庄；第1039章所购仙宅位于城东奇峰下，旁有小溪树林。伏龙山虽多次出入，暂未获得相对洛都足够方位，不强接此幅。","sources":[{"chapter":1038,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1038.html"},{"chapter":1039,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1039.html"}]},{"id":"haotian-qingqiu","title":"青丘谷地","world":"昊天界","area":"青丘","width":4500,"height":3250,"note":"第741章青丘为狐族圣地，谷内参天大树、草地、溪涧与百丈瀑布；第742章瀑布边木屋与谷内分散低层木屋。长盛—青丘途中有意识中断，不能由行程序列补出两地空间方位，因此本图独立分幅。","sources":[{"chapter":741,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/741.html"},{"chapter":742,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/742.html"}]},{"id":"haotian-xuanyou-grotto","title":"玄幽仙府 · 山谷与内府","world":"昊天界","area":"玄幽仙府","width":6000,"height":4500,"note":"玄幽仙府是昊天界发现的洞天，琅琊洞天是假称。主图根据1095入局时亲见外府山林、双峰瀑布、溪谷与草原绘制；内府在一座高峰之内，门是山下符文岩壁，木屋在面向岩壁时左侧。洞窟附图依据1097，白驹塔在巨大洞窟中央，1098确认塔坐落水脉。所有地理罗盘方位未详，不设北针；视角左侧不翻译成地理正西。尾声仙府整座被收入万界指环，本图是收起前内部空间，不能继续以固定地表城址理解。未把内府、白驹塔再拆成独立宇宙。","sources":[{"title":"原文章页 1094","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1094.html"},{"title":"原文章页 1095","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1095.html"},{"title":"原文章页 1097","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1097.html"},{"title":"原文章页 1098","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1098.html"},{"title":"原文章页 1513","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1513.html"},{"title":"尾声（下）","url":"https://www.xiuluows.cc/xiaoshuo/gouzaixianjiechengdalao/3122467.html"}]},{"id":"haotian-jiuzhou-city","title":"九州仙城 · 城区局部","world":"昊天界","area":"九州仙城","width":4000,"height":2750,"note":"原文1102、1103：九州为三大天级仙城之一，也是九州仙盟所在地。洛都至九州乘传送大阵，方向和距离无据，未强接两城。此图只画传送抵达后所见城区：宏伟殿堂与周围琼楼玉宇、奇峰、瀑布、灵植、山居洞府；附近茶楼有据。各图符的方位、数量、峰形与具体街道不明，因此不画全城疆界、城门或伪造道路。","sources":[{"title":"原文章页 1102","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1102.html"},{"title":"原文章页 1103","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1103.html"}]},{"id":"haotian-dikui-frontier","title":"地魁界关 · 临虚空域","world":"昊天界","area":"界外属域 · 地魁界关","width":4250,"height":2875,"note":"原文1349：界关是独立于昊天界之外、接壤虚空的界域；地魁约五千里方圆，一座大型仙城与五座边缘卫城。安沂是其中之一，汪尘洞府位于安沂中心。本图呈现内域与临虚空边缘的地理关系，不封闭绘制无据全域轮廓。主城与安沂实际相对方位、距离不明；未知名的四卫城不伪造地点。右侧附图仅放大安沂中央洞府的包含关系，不表达跨框距离。导航归昊天相关图组，不表示地魁物理上位于昊天大陆。","sources":[{"title":"原文章页 1349","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1349.html"}]},{"id":"yinming-tuoyu-r7","title":"阴冥界 · 卫法城与戊九五拓域","world":"阴冥界","area":"卫法城与拓域","width":5500,"height":3875,"note":"星号为原文可定位的粗地域。山形、岸线、未标距离与建筑形象均为编绘；分幅不表示相互方位。","sources":[{"chapter":505,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/505.html"},{"chapter":507,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/507.html"},{"chapter":510,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/510.html"},{"chapter":536,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/536.html"}]},{"id":"r7-wushan-chibi-taiwu","title":"雾山界 · 赤壁与太武","world":"雾山界","area":"赤壁城及太武山城（独立局部）","width":6000,"height":4250,"note":"问界铃所通的铃中世界，原文正式称雾山界，区别于苍青界和星海界太武星。左右为两处独立局部，不表达赤壁与太武的相对方位及距离。两城山体形态、建筑及地下行道图形为编绘。","sources":[{"chapter":745,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/745.html"},{"chapter":755,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/755.html"},{"chapter":756,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/756.html"},{"chapter":759,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/759.html"},{"chapter":762,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/762.html"},{"chapter":798,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/798.html"},{"chapter":799,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/799.html"}]},{"id":"r7-cangqing-realms","title":"苍青界 · 大梁与邻境","world":"苍青界","area":"大梁及大齐、大燕、南蛮邻境","width":5000,"height":4000,"note":"依据公开转载正文编绘，非作者官方地图。建筑、山形、间距为识别而夸绘；不画无据的国界与海岸线。 本幅以大梁旧称组织地理，不表现各时期政权变化。区域级粗定位不等于州郡疆界。","sources":[{"chapter":886,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/886.html"},{"chapter":964,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/964.html"},{"chapter":969,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/969.html"},{"chapter":993,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/993.html"},{"chapter":994,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/994.html"},{"chapter":996,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/996.html"},{"chapter":1001,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1001.html"},{"chapter":1005,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1005.html"},{"chapter":1019,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1019.html"},{"chapter":1022,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1022.html"}]},{"id":"r7-cangqing-hanhai","title":"苍青界 · 瀚海西境","world":"苍青界","area":"大梁西部瀚海郡与大燕东部","width":5000,"height":4000,"note":"依据公开转载正文编绘，非作者官方地图。建筑、山形、间距为识别而夸绘；不画无据的国界与海岸线。 瀚海关为瀚海城的一部分，本图将城关图符适当拉开以辨认。东望城与瀚海关三十里有据，百里峡之名不作百里长度。","sources":[{"chapter":1001,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1001.html"},{"chapter":1003,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1003.html"},{"chapter":1008,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1008.html"},{"chapter":1014,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1014.html"},{"chapter":1017,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1017.html"},{"chapter":1022,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1022.html"},{"chapter":1024,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1024.html"},{"chapter":1025,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1025.html"}]},{"id":"r7-cangqing-chunan","title":"苍青界 · 东卢府春安江","world":"苍青界","area":"东卢府春安江沿岸","width":5000,"height":4000,"note":"依据公开转载正文编绘，非作者官方地图。建筑、山形、间距为识别而夸绘；不画无据的国界与海岸线。 本幅依据上下游关系编绘；不知春安江总体方向，故不设北标。两城岸别、间距及河道曲线均未核定。临江依山、广平三面平原有据，不添加无方向的靠山村、虎头山及安阳行程。","sources":[{"chapter":912,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/912.html"},{"chapter":913,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/913.html"},{"chapter":923,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/923.html"},{"chapter":938,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/938.html"},{"chapter":950,"url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/950.html"}]},{"id":"xinghai-taiwu-campus","title":"星海界 · 太武星北陆","world":"星海界","area":"太武星群／太武星","width":5500,"height":4500,"note":"1222章明确太武星群主星为太武星，第一军院位于北半球，一座庞大都市围绕学院建立。图只绘这一局部所属和环绕关系，不虚构整颗星球海岸线或星群坐标。学院占地五万余平方公里、专属区七十万平方公里是原文量级，不转换为本图精确半径。地表大部分陆地原始森林是星球级事实；本幅外缘树林为该自然面貌的概括，不能视为实测校园周界。空港在轨道太空堡垒内，本图没有将其错放在地表。","sources":[{"title":"原文章页 1193","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1193.html"},{"title":"原文章页 1222","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1222.html"},{"title":"原文章页 1249","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1249.html"},{"title":"原文章页 1255","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1255.html"}]},{"id":"xueyue-lande-coast","title":"血月界 · 兰德海岸","world":"血月界","area":"英维亚王国／兰德","width":5500,"height":4500,"note":"兰德的东岸、北面平原与无名江河、西南连续高地，以及别墅在城东南临海崖上均有原文方位依据。正文没有给兰德港湾、海岸、河道或城区的精确轮廓。上城区与下城区的名称不当作北南方位；未按名称虚构城区分界。使用西式城港图符；图符为夸绘，不代表实际占地或街区布局。","sources":[{"title":"原文章页 1362","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1362.html"},{"title":"原文章页 1368","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1368.html"},{"title":"原文章页 1392","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1392.html"}]},{"id":"xueyue-selis-estuary","title":"血月界 · 塞力斯河口","world":"血月界","area":"英维亚王国／塞力斯","width":5500,"height":4500,"note":"正文确认塞力斯为英维亚王都，位于芬尼斯河终端及河口冲积平原，船舶由海逆河驶入港口。没有可靠海岸朝向、城市岸别和七区完整分界，故本幅不设北针；河海轮廓及图面方向均为概绘。只把东城区白塔作为城区内已知方位的单点，其他城区不因命名而假定彼此罗盘关系。","sources":[{"title":"原文章页 1392","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1392.html"},{"title":"原文章页 1398","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1398.html"},{"title":"原文章页 1401","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1401.html"},{"title":"原文章页 1453","url":"https://quanben.io/amp/n/gouzaixianjiechengdalao/1453.html"}]}],"worlds":["山海界","昊天界","阴冥界","雾山界","苍青界","星海界","血月界"]};

worldSelect.addEventListener('change',()=>choose(atlas.maps.find(m=>m.world===worldSelect.value)));
function resize(){if(!image.naturalWidth)return;const s=fit?Math.min((canvas.clientWidth-40)/current.width,(canvas.clientHeight-40)/current.height,1):Number(slider.value)/100;image.style.width=Math.round(current.width*s)+'px';image.style.height='auto';document.querySelector('#zoom-value').textContent=Math.round(s*100)+'%';canvas.classList.toggle('original',!fit)}
function choose(m){current=m;worldSelect.value=m.world;side.querySelectorAll('details').forEach(d=>{d.open=d.dataset.world===m.world});side.scrollTo(0,0);status.textContent='正在载入……';image.alt=m.title;image.src='assets/'+m.id+'.preview.webp';document.querySelector('#title').textContent=m.world+' / '+m.title;document.querySelector('#original').href='assets/'+m.id+'.hd.webp';document.querySelector('#svg').href='assets/'+m.id+'.svg';document.querySelector('#project').href='assets/'+m.id+'.map';source.replaceChildren();const p=document.createElement('p');p.textContent=m.note;source.append(p);for(const s of m.sources){if(!s.url)continue;const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=s.chapter?'第'+s.chapter+'章':s.title||'原文';source.append(a)}document.querySelectorAll('.map-button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===m.id)));canvas.scrollTo(0,0);history.replaceState(null,'','#'+m.id)}
for(const world of atlas.worlds){const details=document.createElement('details');details.dataset.world=world;const summary=document.createElement('summary');summary.textContent=world;details.append(summary);let previousArea;for(const m of atlas.maps.filter(m=>m.world===world)){if(m.area!==previousArea){const area=document.createElement('div');area.className='area';area.textContent=m.area;details.append(area);previousArea=m.area}const button=document.createElement('button');button.className='map-button';button.textContent=m.title;button.dataset.id=m.id;button.addEventListener('click',()=>choose(m));details.append(button)}side.append(details)}
image.addEventListener('load',()=>{status.textContent=current.area+' · 高清 '+current.width+' × '+current.height;resize()});image.addEventListener('error',()=>{status.textContent='图片未载入，请刷新此页。'});document.querySelector('#fit').addEventListener('click',()=>{fit=true;resize();canvas.scrollTo(0,0)});slider.addEventListener('input',()=>{fit=false;const hd='assets/'+current.id+'.hd.webp';if(image.getAttribute('src')!==hd)image.src=hd;resize()});window.addEventListener('resize',resize);document.querySelector('#sources').addEventListener('toggle',resize);choose(atlas.maps.find(m=>m.id===location.hash.slice(1))||atlas.maps.find(m=>m.id==='shanhai-yulong-r7')||atlas.maps[0]);
</script></html>
